<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAMMY · 全息閃卡</title>
<link rel="preload" href="./Tammy-web.glb" as="fetch" type="model/gltf-binary" crossorigin>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;color:#dbe3ea;font-family:-apple-system,sans-serif}
  model-viewer{width:100%;height:100dvh;background:#000}
  .poster{position:fixed;inset:0;width:100%;object-fit:contain;background:#000;
    transition:opacity .35s ease;pointer-events:none}
  .poster.hide{opacity:0}
  .hint{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:0;right:0;
    text-align:center;color:#8a94a5;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<img class="poster" id="poster" src="./poster.webp" alt="TAMMY 閃卡">
<model-viewer src="./Tammy-web.glb" alt="TAMMY 閃卡"
  camera-controls auto-rotate rotation-per-second="25deg"
  interaction-prompt="none" shadow-intensity="0"
  environment-image="neutral" exposure="1.2"
  camera-orbit="0deg 80deg 300mm"
  min-camera-orbit="-Infinity 10deg 150mm" max-camera-orbit="Infinity 170deg 600mm">
</model-viewer>
<div class="hint">拖曳轉動卡片 · 雙指縮放</div>
<script>
const v=document.querySelector('model-viewer'),p=document.getElementById('poster');
v.addEventListener('load',()=>{console.log('MODEL LOAD PASS');requestAnimationFrame(()=>p.classList.add('hide'))});
v.addEventListener('error',e=>console.error('MODEL LOAD FAIL',e));
</script>
</body>
</html>
